name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [OFF, ON]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-dev libssl-dev nlohmann-json3-dev
          python -m pip install websockets==15.0.1
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS_DEBUG=-g1 -DNAVAL_SDK_SANITIZERS=${{ matrix.sanitizer }}
      - run: cmake --build build -j2
      - run: ctest --test-dir build --output-on-failure
      - name: Check installed CMake package
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/naval-install"
          cmake -S tests/consumer -B build-consumer -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/naval-install"
          cmake --build build-consumer -j2
          ./build-consumer/consumer
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          brew install boost openssl@3 nlohmann-json
          python -m pip install websockets==15.0.1
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
      - run: cmake --build build -j2
      - run: ctest --test-dir build --output-on-failure
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        shell: pwsh
        run: vcpkg install boost-beast boost-asio openssl nlohmann-json --triplet x64-windows
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      - run: cmake --build build --config Release -j2
      - run: ctest --test-dir build -C Release --output-on-failure
